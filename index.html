<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jeux en lice — Roulette Rétro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');

:root{
  --bg: #0d0618;
  --panel: #1c0f2e;
  --panel-line: #33204a;
  --cyan: #2ee6d0;
  --magenta: #ff3d9a;
  --amber: #ffb627;
  --ink: #f4f1ea;
  --dim: #a495b8;
}
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh;
  background: radial-gradient(ellipse at 50% -10%, #2a1642 0%, transparent 60%), var(--bg);
  color:var(--ink);
  font-family:'Share Tech Mono', monospace;
  padding:36px 18px 60px;
}
.wrap{ max-width:640px; margin:0 auto; }
h1{
  font-family:'Press Start 2P', monospace;
  font-size:clamp(15px, 4vw, 22px);
  text-align:center;
  letter-spacing:2px;
  text-shadow: 0 0 6px var(--cyan), 0 0 18px rgba(46,230,208,0.5), 3px 3px 0 var(--magenta);
  margin:0 0 8px;
}
.sub{ text-align:center; color:var(--dim); font-size:12px; letter-spacing:1px; margin-bottom:30px; }

.list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.list li{
  background: linear-gradient(180deg, var(--panel), #170a26);
  border:1px solid var(--panel-line);
  border-radius:10px;
  padding:14px 16px;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none; } }
.slot-num{
  font-family:'Press Start 2P', monospace;
  font-size:11px; color:var(--panel-line-num, var(--magenta));
  color:var(--magenta);
  width:26px; flex-shrink:0;
}
.game-info{ flex:1; }
.game-name{ font-size:15px; color:var(--ink); }
.viewer-name{ font-size:11px; color:var(--amber); margin-top:3px; }

.empty{
  text-align:center; color:var(--dim); font-size:13px;
  border:1px dashed var(--panel-line); border-radius:10px; padding:34px 20px;
}

.footer-note{
  text-align:center; color:var(--dim); font-size:10px; margin-top:30px; letter-spacing:0.5px;
}
.live-dot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--cyan); box-shadow:0 0 6px var(--cyan);
  margin-right:6px; vertical-align:middle;
  animation: pulse 1.6s infinite;
}
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>JEUX EN LICE</h1>
  <div class="sub"><span class="live-dot"></span>mis à jour en direct</div>
  <ul class="list" id="list"></ul>
</div>

<script>
// ==== CONFIGURATION FIREBASE ====
// Colle EXACTEMENT la même config que dans roulette-retro.html ici.
const firebaseConfig = {
 apiKey: "AIzaSyB9ZPZY-90czFRtBs6wt_yhemXYJ6xcOT4",
  authDomain: "roulette-retro.firebaseapp.com",
  databaseURL: "https://roulette-retro-default-rtdb.firebaseio.com",
  projectId: "roulette-retro"
};

const listEl = document.getElementById('list');

function render(entries){
  if(entries.length === 0){
    listEl.innerHTML = "<div class=\"empty\">Aucun jeu ajouté pour l'instant — utilise tes points de chaîne !</div>";
    return;
  }
  listEl.innerHTML = entries.map((e, i) => `
    <li>
      <span class="slot-num">${String(i+1).padStart(2,'0')}</span>
      <span class="game-info">
        <div class="game-name">${escapeHtml(e.game)}</div>
        <div class="viewer-name">proposé par ${escapeHtml(e.viewer)}</div>
      </span>
    </li>
  `).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

if(firebaseConfig.apiKey === "TON_API_KEY"){
  listEl.innerHTML = '<div class="empty">Configuration Firebase manquante dans ce fichier.</div>';
}else{
  firebase.initializeApp(firebaseConfig);
  const dbRef = firebase.database().ref('gameQueue');
  dbRef.on('value', (snapshot) => {
    const val = snapshot.val() || {};
    const entries = Object.keys(val).map(key => ({ id: key, viewer: val[key].viewer, game: val[key].game }));
    render(entries);
  }, (err) => {
    listEl.innerHTML = '<div class="empty">Impossible de charger la liste en direct.</div>';
    console.error(err);
  });
}
</script>
</body>
</html>
